[project]
name = "geo-saas"
version = "0.1.0"
description = "GEO/AEO SaaS for medical marketing — 의료 도메인 AI 검색 노출 최적화 + 자동 콘텐츠 생성"
requires-python = ">=3.11"
authors = [{ name = "메디맵" }]

dependencies = [
    "streamlit>=1.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "trafilatura>=1.12",  # URL → 본문 추출 (Phase 1.5 reference fetcher)
    "beautifulsoup4>=4.12",  # 메타/이미지 태그 파싱
    "chromadb>=0.5",  # Phase 3 Reference Library (RAG vector store)
    # LLM providers (선택적 사용 — .env LLM_PROVIDER로 토글)
    "google-generativeai>=0.7",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

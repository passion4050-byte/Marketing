name: Auto-learn cited own content (daily 08:00 UTC = 17:00 KST)

# Round 143h — 자사(T1) 인용 콘텐츠 자동 학습.
# AI 가 실제로 출처로 인용한 wecircle.co.kr URL 의 구조 패턴을 분석해
# learned_insights 에 applied=true 로 저장 → Python 생성기가 다음 발행 사이클에 반영.
# Round 143i — 매일 실행으로 변경 (인용 발생 즉시 당일 학습 → 다음날 발행에 반영).

on:
  schedule:
    - cron: '0 8 * * *'   # 매일 08:00 UTC = 17:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: '집계 기간(일) — 기본 60'
        type: string
        default: '60'
      topN:
        description: '학습할 상위 URL 수'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: auto-learn-own
  cancel-in-progress: false

jobs:
  learn-own:
    name: Auto-learn cited own wecircle content
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 학습 + 발행 합산
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VERCEL_PROD_URL }}" ]; then
            echo "::error::VERCEL_PROD_URL 미설정"; exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET 미설정"; exit 1
          fi

      # Step 1: 자사 인용 콘텐츠 패턴 학습
      - name: Step 1 — Auto-learn from cited own content
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ inputs.days }}
          TOPN: ${{ inputs.topN }}
        run: |
          DAYS="${DAYS:-60}"; TOPN="${TOPN:-5}"
          echo "auto-learn-own: days=$DAYS topN=$TOPN"
          RESP=$(curl -sS -X POST "$VERCEL_URL/api/admin/auto-learn-own" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d "{\"cronSecret\":\"$CRON_SECRET\",\"days\":$DAYS,\"topN\":$TOPN}")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::auto-learn-own 실패"; exit 1; }
          LEARNED=$(echo "$RESP" | grep -o '"learned":[0-9]*' | grep -o '[0-9]*' || echo "?")
          TOTAL=$(echo "$RESP" | grep -o '"totalT1Urls":[0-9]*' | grep -o '[0-9]*' || echo "?")
          echo "✅ 자사 인용 URL 총 $TOTAL 개 발견 → $LEARNED 개 학습 완료"

      # Step 2: 학습된 패턴 즉시 반영해 콘텐츠 발행
      - name: Step 2 — Generate + publish content with learned patterns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'nano_banana' }}
          IMAGE_STRICT: ${{ secrets.IMAGE_STRICT || 'true' }}
        run: python scripts/run_auto_content_once.py
      - name: Step 2.5 — Backfill missing draft cover images
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IMAGE_GEN_ENABLED: 'true'
          IMAGE_PROVIDER: nano_banana
        run: python scripts/backfill_drafts_cover.py || true
      # 🔴 Round 191 (2026-09-03) — Step 3(배포 훅) 제거. Round 189 가 발행
      #   워크플로 3개에서 뺀 것과 같은 이유인데, **매일 도는 이 워크플로가
      #   빠져 있었다.**
      #   실측(2026-09-02): 이 런이 12:25→12:48 에 돌면서 12:48:18 에
      #   medimap-blog 배포를 하나 더 만들었다(훅 이름 `auto-publish-cron`
      #   = VERCEL_DEPLOY_HOOK_ADMIN). ⚠ ADMIN 훅은 이름과 달리 geo-v2 가
      #   아니라 medimap-blog 를 가리킨다 — 즉 위 BLOG 훅과 **같은 사이트**다.
      #   · 발행(status 변경)은 DB 트리거 trg_fire_vercel_on_publish 가 이미
      #     덮는다(BEFORE INSERT OR UPDATE OF status, 30분 디바운스).
      #   · 이 워크플로의 나머지 작업(learned_insights 기록, 커버 이미지 백필)은
      #     status 를 바꾸지 않으므로 트리거 대상이 아니고, 공개 라우트가 전부
      #     ISR 이라 재빌드 없이도 revalidate 창 안에 반영된다.
      #   · 배포는 오히려 ISR 캐시를 통째로 무효화해 콜드 렌더를 만든다(Round 186).

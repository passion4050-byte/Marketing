name: Auto-learn cited own content (daily 08:00 UTC = 17:00 KST)

# Round 143h — 자사(T1) 인용 콘텐츠 자동 학습.
# AI 가 실제로 출처로 인용한 wecircle.co.kr URL 의 구조 패턴을 분석해
# learned_insights 에 applied=true 로 저장 → Python 생성기가 다음 발행 사이클에 반영.
# Round 143i — 매일 실행으로 변경 (인용 발생 즉시 당일 학습 → 다음날 발행에 반영).

on:
  schedule:
    - cron: '0 8 * * *'   # 매일 08:00 UTC = 17:00 KST
  workflow_dispatch:
    inputs:
      days:
        description: '집계 기간(일) — 기본 60'
        type: string
        default: '60'
      topN:
        description: '학습할 상위 URL 수'
        type: string
        default: '5'

permissions:
  contents: read

concurrency:
  group: auto-learn-own
  cancel-in-progress: false

jobs:
  learn-own:
    name: Auto-learn cited own wecircle content
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 학습 + 발행 합산
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VERCEL_PROD_URL }}" ]; then
            echo "::error::VERCEL_PROD_URL 미설정"; exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET 미설정"; exit 1
          fi

      # Step 1: 자사 인용 콘텐츠 패턴 학습
      - name: Step 1 — Auto-learn from cited own content
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ inputs.days }}
          TOPN: ${{ inputs.topN }}
        run: |
          DAYS="${DAYS:-60}"; TOPN="${TOPN:-5}"
          echo "auto-learn-own: days=$DAYS topN=$TOPN"
          RESP=$(curl -sS -X POST "$VERCEL_URL/api/admin/auto-learn-own" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d "{\"cronSecret\":\"$CRON_SECRET\",\"days\":$DAYS,\"topN\":$TOPN}")
          echo "$RESP"
          echo "$RESP" | grep -q '"ok":true' || { echo "::error::auto-learn-own 실패"; exit 1; }
          LEARNED=$(echo "$RESP" | grep -o '"learned":[0-9]*' | grep -o '[0-9]*' || echo "?")
          TOTAL=$(echo "$RESP" | grep -o '"totalT1Urls":[0-9]*' | grep -o '[0-9]*' || echo "?")
          echo "✅ 자사 인용 URL 총 $TOTAL 개 발견 → $LEARNED 개 학습 완료"

      # Step 2: 학습된 패턴 즉시 반영해 콘텐츠 발행
      - name: Step 2 — Generate + publish content with learned patterns
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'nano_banana' }}
          IMAGE_STRICT: ${{ secrets.IMAGE_STRICT || 'true' }}
        run: python scripts/run_auto_content_once.py

      # Step 3: Vercel 재배포 (신규 콘텐츠 즉시 라이브)
      - name: Step 3 — Trigger Vercel redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_BLOG: ${{ secrets.VERCEL_DEPLOY_HOOK_BLOG }}
          VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_BLOG" ]; then
            echo "Triggering medimap-blog redeploy..."
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK_BLOG" || true
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_ADMIN" ]; then
            echo "Triggering geo-v2 (admin) redeploy..."
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK_ADMIN" || true
          fi
          echo "✅ 학습 → 발행 → 배포 완료"

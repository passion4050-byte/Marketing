  name: Deploy medimap-blog to Vercel

  # 🔴 Round 191 (2026-09-03) — push 트리거 제거. Vercel GitHub 통합이 이미
  #   같은 커밋을 배포하고 있어서 push 1회에 **프로덕션 배포가 2건** 생겼다.
  #   실측(2026-09-02, 커밋 cf2be84):
  #     09:46:39Z  repoPushedAt 배포 (Vercel GitHub 통합)
  #     09:46:48Z  deployHookName=blog 배포 (이 워크플로) ← 9초 뒤 중복
  #   Hobby 는 빌드 동시성 1 이라 중복 빌드는 뒤 작업을 그대로 밀고,
  #   배포마다 ISR 캐시가 통째로 날아가 콜드 렌더가 생긴다(Round 186).
  #   ⚠ 지우지 않고 수동 트리거로 남긴다 — 통합 배포가 막혔을 때
  #     "손으로 빌드를 하나 밀어넣는" 수단은 있어야 한다(Round 190 원칙).
  on:
    workflow_dispatch: {}

  jobs:
    trigger-vercel:
      name: Trigger Vercel deploy
      runs-on: ubuntu-latest
      steps:
        - name: Verify secret is set
          run: |
            if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
              echo "::error::VERCEL_DEPLOY_HOOK secret 미설정"
              exit 1
            fi

        - name: Trigger Vercel deploy hook
          run: |
            response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
            status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d':' -f2)
            echo "Status: $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error::Deploy hook 실패"
              exit 1
            fi
            echo "::notice::Vercel 빌드 큐 적재 완료"

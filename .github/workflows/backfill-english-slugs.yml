name: Backfill English slugs (manual)

# Round 174j (2026-08-24) — 한글 슬러그 → 영문 슬러그. 구 URL 은 former_slug 로 301.
#
#   실측 근거: 국내 ko 파트너 라이브 182편 중
#     ASCII 슬러그  52편 → 27편(51.9%) GSC 노출, 180 impressions
#     한글 슬러그  130편 → **0편(0.0%)**, 0 impressions
#   130편 전부 gsc_daily 관측 시작(2026-07-05) 이후 발행 = 측정된 0.
#
#   원인이던 DB 트리거는 Round 174h 에서 생성 경로를 고쳐 막았고(LLM 영문 슬러그),
#   이 워크플로는 **기존 재고**를 교정한다.
#
#   ⚠ cron 없음. URL 을 바꾸는 작업이라 사람이 판단해서 돌린다.
#   ⚠ 반드시 dry_run=1 로 먼저 계획을 확인할 것. 슬러그 품질이 눈으로 검증돼야 한다.
#   ⚠ limit 를 작게 시작(10)해서 첫 배치의 슬러그가 납득되면 늘릴 것.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1이면 계획만 출력하고 아무것도 바꾸지 않음'
        required: false
        default: '1'
        type: string
      limit:
        description: '한 번에 처리할 편수 (10부터 시작 권장)'
        required: false
        default: '10'
        type: string
      batch:
        description: 'LLM 1회 호출당 제목 수'
        required: false
        default: '12'
        type: string

permissions:
  contents: read

concurrency:
  group: backfill-english-slugs
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # LLM 호출이 배치당 1회뿐이라 빠르다. 100편이어도 10분 이내.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret 미설정"; exit 1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "::error::ANTHROPIC_API_KEY 또는 OPENAI_API_KEY 필요"; exit 1
          fi
      - name: Run slug backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # ⚠ Gemini 는 쓰지 않는다. 2026-08-23 prepayment credits 고갈로 429.
          #   슬러그 생성은 짧은 호출이라 anthropic 로 충분하다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          LIMIT: ${{ github.event.inputs.limit }}
          BATCH: ${{ github.event.inputs.batch }}
        run: python scripts/backfill_english_slugs.py

      # URL 이 바뀌므로 sitemap 도 바뀐다. 재배포로 즉시 반영.
      - name: Trigger Vercel deploy hook — medimap-blog
        if: success() && env.VERCEL_DEPLOY_HOOK_BLOG != '' && github.event.inputs.dry_run != '1'
        env:
          VERCEL_DEPLOY_HOOK_BLOG: ${{ secrets.VERCEL_DEPLOY_HOOK_BLOG }}
        run: curl -sS -X POST "$VERCEL_DEPLOY_HOOK_BLOG" || true

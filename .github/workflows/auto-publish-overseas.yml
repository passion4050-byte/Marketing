name: Auto-publish OVERSEAS content (cron)

# 국내/해외 분리 운영 — 해외(EN/JA/ZH)는 tenant_products 로 언어 상품을 신청한
#   (tenant, market, lang) 조합만 별도 cadence 로 생성한다(MARKET_ONLY=overseas).
#   기존 auto-publish.yml(국내 포함 로테이션)과 독립. 해외 콘텐츠 볼륨(=AI 인용) 병목 해소.
#   해외는 항상 draft — 어드민에서 검수 후 수동 발행(의료법).
on:
  schedule:
    - cron: '0 6 * * *'    # 매일 06:00 UTC = 15:00 KST — 해외 전용
  workflow_dispatch:
    inputs:
      tenant_id:
        description: '특정 tenant 만 (비우면 해외 상품 활성 tenant 전체)'
        required: false
        type: string
      keyword:
        description: '키워드 override (선택)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: auto-publish-overseas
  cancel-in-progress: false

jobs:
  generate:
    name: Generate overseas drafts (gated by tenant_products)
    runs-on: ubuntu-latest
    # 🔴 Round 191 (2026-09-03) — 20 → 60.
    #   20분은 배치를 다 돌기에 부족했다. 최근 6런 중 2런이 **정확히 20:19 에
    #   cancelled** 로 잘렸다(2026-08-31 12:25→12:46, 2026-09-02 10:24→10:44).
    #   09-02 런은 잘리기 전까지 ja 3편만 발행(10:32·10:35·10:41)하고 죽었다 —
    #   러너 준비에 ~8분, 1편당 ~2.5~3분이라 20분 안에는 3~4편이 한계다.
    #   실패로 안 보이고 "cancelled" 로 뜨기 때문에 **부분 발행을 성공처럼 착각**한다.
    #   같은 성격의 ko 배치(auto-publish.yml)는 90분, brighteye 는 40분이다.
    #   리포가 public 이라 Actions 분은 무료 — 시간을 아낄 이유가 없다.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret 미설정"
            exit 1
          fi

      - name: Run daily_auto_content_job (overseas only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'nano_banana' }}
          IMAGE_STRICT: ${{ secrets.IMAGE_STRICT || 'true' }}
          IMAGE_STRICT_DALLE: ${{ secrets.IMAGE_STRICT_DALLE || 'true' }}
          TARGET_TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_KEYWORD: ${{ inputs.keyword }}
          # 해외 전용 게이트 — 이 워크플로의 핵심.
          MARKET_ONLY: overseas
        run: python scripts/run_auto_content_once.py

      # 🔴 Round 189 (2026-09-02) — 워크플로 배포 훅 제거.
      #   재빌드는 Supabase DB 트리거(trg_fire_vercel_on_publish, 30분 디바운스)가
      #   이미 담당한다. 그쪽이 더 일반적이다 — 이 워크플로뿐 아니라 어드민
      #   즉시발행·백필 등 **모든 발행 경로**를 덮는다.
      #   실측(2026-09-02 08:21~08:33 런): 발행 5편에 배포 3건이 생성됐는데
      #     supabase-publish(DB 트리거) 1건  ← 디바운스가 5→1 로 접은 결과
      #     blog(VERCEL_DEPLOY_HOOK_BLOG)  1건 ← 여기서 쏜 것
      #     auto-publish-cron(VERCEL_DEPLOY_HOOK_ADMIN) 1건 ← 여기서 쏜 것
      #   ⚠ 게다가 ADMIN 훅은 이름과 달리 geo-v2 가 아니라 **medimap-blog** 를
      #     가리키고 있었다(훅 소유 프로젝트로 확인). 즉 같은 사이트를 두 번 더 빌드.
      #   공개 라우트가 전부 ISR(60초/3600초)이라 재빌드 자체가 콘텐츠 노출에
      #   필요하지 않고, 배포는 오히려 ISR 캐시를 통째로 무효화해 콜드 렌더를 만든다
      #   (Round 186). Hobby 빌드 동시성 1 이라 긴급 수정도 이 뒤에 밀린다.
      #   → 배포 훅을 여기서 쏘지 않는다. DB 트리거를 끄게 되면 그때 되살릴 것.

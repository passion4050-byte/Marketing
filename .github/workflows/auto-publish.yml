name: Auto-publish content (cron)

# 2026-05-28 Round 22: Phase 3 완료 → 매일 23:00 UTC 단일 실행.
# 2026-06-01 Round 59: 자사 노출도 0% → 콘텐츠 양 부족 진단. 2회/일 로 확대.
#   - 08:00 KST (23:00 UTC) — 자사 인사이트 발행
#   - 14:00 KST (05:00 UTC) — 파트너 콘텐츠 발행 (워크플로우 안에서 rotation 적용)
on:
  schedule:
    - cron: '0 23 * * *'   # 매일 23:00 UTC = 08:00 KST
    - cron: '0 5 * * *'    # 매일 05:00 UTC = 14:00 KST (Round 59 추가)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  generate:
    name: Generate + publish 1 cycle
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret 미설정"
            exit 1
          fi

      - name: Run daily_auto_content_job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Round 59 (2026-06-01) — ANTHROPIC_MODEL secret 전달 (이전 누락 → default Haiku 강제됨)
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          # Round 81 — Unsplash 실사 사진(자사 콘텐츠 cover). 미설정 시 사람없는 Pollinations 폴백.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          # Round 81 — 실효 지출 캡(카운트 가드)을 cron 에 노출. USD 가드는 토큰 미기록으로
          #   현재 no-op 이므로, 일일 생성 건수 상한이 실질적 비용 제어 레버. secret 으로 조정.
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
        run: python scripts/run_auto_content_once.py

      # 2026-05-29 Round 24: 두 사이트(medimap-blog + medimap-blog-v2) 모두 redeploy.
      # 60s module-level cache 무효화 + 새 글 즉시 라이브 노출.
      - name: Trigger Vercel deploy hook — medimap-blog (자사+파트너 노출)
        if: success() && env.VERCEL_DEPLOY_HOOK_BLOG != ''
        env:
          VERCEL_DEPLOY_HOOK_BLOG: ${{ secrets.VERCEL_DEPLOY_HOOK_BLOG }}
        run: |
          echo "Triggering medimap-blog redeploy..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_BLOG" || true
          echo ""

      - name: Trigger Vercel deploy hook — geo-v2 (어드민 콘솔)
        if: success() && env.VERCEL_DEPLOY_HOOK_ADMIN != ''
        env:
          VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
        run: |
          echo "Triggering geo-v2 (admin) redeploy..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_ADMIN" || true
          echo ""

      # 하위 호환 — 기존 단일 VERCEL_DEPLOY_HOOK secret 도 지원
      - name: Trigger Vercel deploy hook — legacy single
        if: success() && env.VERCEL_DEPLOY_HOOK != '' && env.VERCEL_DEPLOY_HOOK_BLOG == ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering legacy single deploy hook..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" || true

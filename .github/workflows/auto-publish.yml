name: Auto-publish content (cron)

# 2026-05-28 Round 22: Phase 3 완료 → 매일 23:00 UTC 단일 실행.
# 2026-06-01 Round 59: 자사 노출도 0% → 콘텐츠 양 부족 진단. 2회/일 로 확대.
#   - 08:00 KST (23:00 UTC) — 자사 인사이트 발행
#   - 14:00 KST (05:00 UTC) — 파트너 콘텐츠 발행 (워크플로우 안에서 rotation 적용)
on:
  schedule:
  - cron: '0 23 * * 0,2,4'   # 일/화/목 23:00 UTC = 월/수/금 08:00 KST
  - cron: '0 5 * * 1,3,5'    # 월/수/금 05:00 UTC = 월/수/금 14:00 KST
  # Round 120 (2026-07-03) — admin 즉시발행(publish-now API)이 tenant_id/keyword 를
  # inputs 로 보내는데 정의가 없어 422 발생 → inputs 정의 + run step env 전달.
  workflow_dispatch:
    inputs:
      tenant_id:
        description: '특정 tenant 만 즉시 1편 생성 (비우면 일반 로테이션)'
        required: false
        type: string
      keyword:
        description: '키워드 override (선택 — 비우면 tenant 활성 키워드 사용)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  generate:
    name: Generate + publish 1 cycle
    runs-on: ubuntu-latest
    # Round 83 (2026-06-28) — 8m → 20m. 8개 tenant × retry 3번 + 이미지 생성 시간 고려.
    # auto-publish #92 가 8m 도달해 cancelled. 2 tenant 만 처리됐었음.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL secret 미설정"
            exit 1
          fi

      - name: Run daily_auto_content_job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Round 59 (2026-06-01) — ANTHROPIC_MODEL secret 전달 (이전 누락 → default Haiku 강제됨)
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          # Round 81 — Unsplash 실사 사진(자사 콘텐츠 cover). 미설정 시 사람없는 Pollinations 폴백.
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          # Round 81 — 실효 지출 캡(카운트 가드)을 cron 에 노출. USD 가드는 토큰 미기록으로
          #   현재 no-op 이므로, 일일 생성 건수 상한이 실질적 비용 제어 레버. secret 으로 조정.
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          # Round 108-a (2026-07-03) — Nano Banana (Gemini 2.5 Flash Image) 로 전환.
          # OpenAI tier 2 는 이미지 모델 접근 불가 (dalle 400). Gemini paid = Nano Banana OK.
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'nano_banana' }}
          # true 이면 Nano Banana 3회 시도 실패 시 fallback 안 함 (image None).
          # Round 105 잔재 IMAGE_STRICT_DALLE 도 하위호환 인식.
          IMAGE_STRICT: ${{ secrets.IMAGE_STRICT || 'true' }}
          IMAGE_STRICT_DALLE: ${{ secrets.IMAGE_STRICT_DALLE || 'true' }}
          # Round 120 — 즉시발행 타깃 (workflow_dispatch inputs → 스케줄러 타깃 실행)
          TARGET_TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_KEYWORD: ${{ inputs.keyword }}
        run: python scripts/run_auto_content_once.py

      # 2026-05-29 Round 24: 두 사이트(medimap-blog + medimap-blog-v2) 모두 redeploy.
      # 60s module-level cache 무효화 + 새 글 즉시 라이브 노출.
      - name: Trigger Vercel deploy hook — medimap-blog (자사+파트너 노출)
        if: success() && env.VERCEL_DEPLOY_HOOK_BLOG != ''
        env:
          VERCEL_DEPLOY_HOOK_BLOG: ${{ secrets.VERCEL_DEPLOY_HOOK_BLOG }}
        run: |
          echo "Triggering medimap-blog redeploy..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_BLOG" || true
          echo ""

      - name: Trigger Vercel deploy hook — geo-v2 (어드민 콘솔)
        if: success() && env.VERCEL_DEPLOY_HOOK_ADMIN != ''
        env:
          VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
        run: |
          echo "Triggering geo-v2 (admin) redeploy..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK_ADMIN" || true
          echo ""

      # 하위 호환 — 기존 단일 VERCEL_DEPLOY_HOOK secret 도 지원
      - name: Trigger Vercel deploy hook — legacy single
        if: success() && env.VERCEL_DEPLOY_HOOK != '' && env.VERCEL_DEPLOY_HOOK_BLOG == ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering legacy single deploy hook..."
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" || true

name: Daily brighteye ALL languages (07:00 KST)

# Round 160 (2026-08-16) — 유료 클라이언트(밝은눈안과 강남점, tenant 19, 3개월 테스트)
# 콘텐츠를 매일 5개 언어(ko·en·ja·zh-Hans·zh-Hant) 전부 생성하는 전용 워크플로.
#
# 일반 로테이션(auto-publish/auto-publish-overseas)은 tenant 순환이라 특정 병원의
# "매일 전 언어"를 보장하지 못함 → LANG_ONLY 타깃(Round 160 scheduler)으로 언어별 1회씩.
#
# 발행 규약: ko 는 compliance pass + auto_publish 설정 시 즉시 published,
# 해외 4개 언어는 **draft** (의료법 — 어드민 검수 후 발행. 기존 규약 유지).
# 언어별 continue-on-error — 한 언어 실패가 나머지를 막지 않는다.

on:
  schedule:
    # 🔴 Round 174c (2026-08-23) — 매일 → 월·수·금.
    #   매일 5개 언어를 돌려 이 테넌트 하나가 주 43편, 전체 발행의 57% 를 차지했다.
    #   사용자 방침: "양보다 질, 단 모든 권역은 콘텐츠가 나와야 한다, 발행량이 많으면
    #   빈도를 줄여도 된다" → 언어는 5개 전부 유지하고 빈도만 1/2 이하로.
    #   주 35편 → 주 15편. (22:00 UTC + 9h 이므로 UTC 일·화·목 = KST 월·수·금)
    - cron: '0 22 * * 0,2,4'   # 일·화·목 22:00 UTC = 월·수·금 07:00 KST
  workflow_dispatch:
    inputs:
      langs:
        description: '생성할 언어 (콤마구분, 기본 전체)'
        type: string
        default: 'ko,en,ja,zh-Hans,zh-Hant'

permissions:
  contents: read

concurrency:
  group: daily-brighteye
  cancel-in-progress: false

env:
  BRIGHTEYE_TENANT_ID: '19'

jobs:
  generate:
    name: Generate brighteye content in all languages
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate per language
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '10' }}
          MAX_CONTENT_GEN_PER_DAY: ${{ secrets.MAX_CONTENT_GEN_PER_DAY || '50' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'nano_banana' }}
          IMAGE_STRICT: ${{ secrets.IMAGE_STRICT || 'true' }}
          IMAGE_STRICT_DALLE: ${{ secrets.IMAGE_STRICT_DALLE || 'true' }}
          TARGET_TENANT_ID: '19'
          LANGS: ${{ inputs.langs || 'ko,en,ja,zh-Hans,zh-Hant' }}
        run: |
          FAIL=0
          IFS=',' read -ra ARR <<< "$LANGS"
          for L in "${ARR[@]}"; do
            L="$(echo "$L" | xargs)"
            if [ "$L" = "ko" ]; then M=""; else M="overseas"; fi
            echo "════ lang=$L market=${M:-rotation} ════"
            if LANG_ONLY="$L" MARKET_ONLY="$M" python scripts/run_auto_content_once.py; then
              echo "  → OK"
            else
              echo "  → FAILED (lang=$L)"; FAIL=$((FAIL+1))
            fi
          done
          echo "failed_langs=$FAIL" >> "$GITHUB_OUTPUT" || true
          # 전 언어 실패 시에만 워크플로 실패
          TOTAL=${#ARR[@]}
          if [ "$FAIL" -ge "$TOTAL" ]; then exit 1; fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## brighteye 전 언어 데일리 (tenant 19)"
            echo "- ko: compliance pass 시 즉시 발행 · en/ja/zh-Hans/zh-Hant: draft (어드민 검수 후 발행)"
            echo "- 검수: geo-v2 /admin/content-queue"
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 Round 189 (2026-09-02) — 워크플로 배포 훅 제거.
      #   재빌드는 Supabase DB 트리거(trg_fire_vercel_on_publish, 30분 디바운스)가
      #   이미 담당한다. 그쪽이 더 일반적이다 — 이 워크플로뿐 아니라 어드민
      #   즉시발행·백필 등 **모든 발행 경로**를 덮는다.
      #   실측(2026-09-02 08:21~08:33 런): 발행 5편에 배포 3건이 생성됐는데
      #     supabase-publish(DB 트리거) 1건  ← 디바운스가 5→1 로 접은 결과
      #     blog(VERCEL_DEPLOY_HOOK_BLOG)  1건 ← 여기서 쏜 것
      #     auto-publish-cron(VERCEL_DEPLOY_HOOK_ADMIN) 1건 ← 여기서 쏜 것
      #   ⚠ 게다가 ADMIN 훅은 이름과 달리 geo-v2 가 아니라 **medimap-blog** 를
      #     가리키고 있었다(훅 소유 프로젝트로 확인). 즉 같은 사이트를 두 번 더 빌드.
      #   공개 라우트가 전부 ISR(60초/3600초)이라 재빌드 자체가 콘텐츠 노출에
      #   필요하지 않고, 배포는 오히려 ISR 캐시를 통째로 무효화해 콜드 렌더를 만든다
      #   (Round 186). Hobby 빌드 동시성 1 이라 긴급 수정도 이 뒤에 밀린다.
      #   → 배포 훅을 여기서 쏘지 않는다. DB 트리거를 끄게 되면 그때 되살릴 것.

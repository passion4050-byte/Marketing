name: Review reminder (daily 09:00 KST)

# Round 29 (2026-05-30) — 검수 워크플로 자동 알림.
# 매일 09:00 KST 에 어드민 검수 대기 큐 (status='draft') 카운트 확인 →
# > 0 이면 Slack 으로 알림.
#
# 필요 secrets:
#   - SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (이미 등록됨)
#   - SLACK_REMINDER_WEBHOOK (사용자가 추가 등록 필요)

on:
  schedule:
    - cron: '0 0 * * *'   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: review-reminder
  cancel-in-progress: false

jobs:
  remind:
    name: Check draft queue and notify
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY 미설정"
            exit 1
          fi

      # Round 29 fix 5 (2026-05-30): 두 step 합치기.
      # multiline 변수가 step 간 잘 전달 안 되는 함정 → in-step bash 변수로 처리.
      - name: Check draft queue and notify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SLACK_REMINDER_WEBHOOK: ${{ secrets.SLACK_REMINDER_WEBHOOK }}
        run: |
          SUPA_URL=$(echo -n "$SUPABASE_URL" | tr -d '\n\r' | sed 's/[[:space:]]*$//' | sed 's:/*$::')
          SUPA_KEY=$(echo -n "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '\n\r' | sed 's/[[:space:]]*$//')

          # 어드민 /api/admin/content-queue 와 동일 query (status IN draft, pending)
          # Round 29 fix 9: tenants(name) join 제거 — PostgREST 환경에서 에러 객체 반환 케이스 회피.
          # tenant_name 표시는 어드민 페이지에서 확인. Slack 알림은 id + title 만으로 충분.
          RESP=$(curl -sS "$SUPA_URL/rest/v1/generated_contents?status=in.(draft,pending)&select=id,title,keyword_text&order=created_at.desc" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY")

          DRAFT_COUNT=$(echo "$RESP" | jq 'length')
          echo "Draft count: $DRAFT_COUNT"

          # Summary 작성
          {
            echo "## 검수 알림 결과"
            echo "- Draft 대기: $DRAFT_COUNT 건"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$DRAFT_COUNT" -eq 0 ]; then
            echo "Draft 0건 — 알림 skip"
            exit 0
          fi
          if [ -z "$SLACK_REMINDER_WEBHOOK" ]; then
            echo "SLACK_REMINDER_WEBHOOK 미설정 — 알림 skip"
            exit 0
          fi

          # 디버그 — RESP raw 첫 600자 + type 확인 (jq 거치지 않고)
          echo "--- RESP raw (first 600 chars) ---"
          echo "${RESP:0:600}"
          echo "--- RESP TYPE ---"
          RESP_TYPE=$(echo "$RESP" | jq -r 'type' 2>&1 || echo "(jq type failed)")
          echo "$RESP_TYPE"
          echo "--- END DEBUG ---"

          # RESP 가 array 가 아니면 강제 wrap (예외 대응)
          if [ "$RESP_TYPE" != "array" ]; then
            RESP_ARRAY=$(echo "$RESP" | jq '[.]' 2>/dev/null || echo "[]")
          else
            RESP_ARRAY="$RESP"
          fi

          # Round 29 fix 9 (2026-05-30): tenants join 안 받음.
          # 단순히 id + title + keyword 만 표시. 가장 robust.
          DRAFT_LIST=$(echo "$RESP_ARRAY" | jq -r '
            .[0:10][] |
            "• [\(.id // "?")] \(.title // .keyword_text // "(제목 없음)") "
          ' 2>&1 || echo "(목록 생성 실패)")
          echo "--- DRAFT_LIST (debug) ---"
          echo "$DRAFT_LIST"
          echo "--- END LIST DEBUG ---"

          WEBHOOK=$(echo -n "$SLACK_REMINDER_WEBHOOK" | tr -d '\n\r' | sed 's/[[:space:]]*$//')
          ADMIN_URL="https://geo-v2-git-main-medimaps-projects.vercel.app/admin/content-queue"

          # 메시지 빌드 — bash 변수 concat + printf 로 줄바꿈 명시 (들여쓰기 영향 0)
          NL=$'\n'
          MSG="📝 *메디맵 어드민 검수 대기 ${DRAFT_COUNT}건*"
          MSG="${MSG}${NL}어제 메디맵AI로 생성된 초안 글을 검수해 주세요."
          MSG="${MSG}${NL}${NL}*검수 대기 목록:*"
          MSG="${MSG}${NL}${DRAFT_LIST}"
          MSG="${MSG}${NL}${NL}👉 <${ADMIN_URL}|바로가기>"
          MSG="${MSG}${NL}운영 흐름: 초안 → 메디맵 자체 데이터·사례 정성 추가 → 발행 처리"

          PAYLOAD=$(jq -n --arg text "$MSG" '{text: $text}')
          curl -sS -X POST "$WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" || true

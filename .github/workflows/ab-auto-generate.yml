name: A/B auto-generate (weekly Mon 07:00 KST)

# Round 74 (2026-06-22) — 완전 자동 A/B 변형 생성.
# 적용 인사이트 있는 병원의 키워드를 골라 A(기존)/B(인사이트) 변형 2개를 검수 큐에 생성.
# 보수적: 1회 1개. 발행은 기존 검수 큐 + 컴플라이언스 린트 거침 (라이브 직행 X).

on:
  schedule:
    - cron: '0 22 * * 1'   # 월요일 22:00 UTC = 화요일 07:00 KST
  workflow_dispatch:
    inputs:
      max_new:
        description: '이번 실행 생성 개수'
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: ab-auto-generate
  cancel-in-progress: false

jobs:
  generate:
    name: Auto-generate A/B variants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL 미설정"
            exit 1
          fi
      - name: Run A/B auto-generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'fallback' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001' }}
          IMAGE_GEN_ENABLED: ${{ secrets.IMAGE_GEN_ENABLED || 'true' }}
          AB_AUTO_MAX_NEW: ${{ inputs.max_new || '1' }}
        run: python scripts/run_ab_auto.py

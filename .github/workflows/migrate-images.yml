name: Migrate Pollinations to Storage (one-shot)

# Round 26 (2026-05-29) — 이미지 X 박스 영구 해결.
# 기존 자사 6편 + 파트너 6편의 cover_image_url 과 body 안 Pollinations URL 을
# Supabase Storage 의 영구 public URL 로 일괄 마이그레이션.
#
# 실행: Actions UI → "Migrate Pollinations to Storage" → Run workflow.
# 멱등 — 이미 Storage URL 인 글은 skip. 안전 재실행.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: migrate-images
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate to Supabase Storage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL 미설정"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL 미설정"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY 미설정"
            exit 1
          fi

      - name: Run migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/migrate_pollinations_to_storage.py

      - name: Trigger Vercel redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_BLOG: ${{ secrets.VERCEL_DEPLOY_HOOK_BLOG }}
          VERCEL_DEPLOY_HOOK_ADMIN: ${{ secrets.VERCEL_DEPLOY_HOOK_ADMIN }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_BLOG" ]; then
            echo "Triggering medimap-blog redeploy..."
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK_BLOG" || true
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_ADMIN" ]; then
            echo "Triggering geo-v2 redeploy..."
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK_ADMIN" || true
          fi

name: Send monthly reports (daily 09:00 UTC = 18:00 KST, filtered by report_send_day)

# Round 53 (2026-05-31) — 매일 실행, endpoint 가 today.day == tenant.report_send_day 인 tenant 만 발송.
# Round 48 (2026-05-31) — 모든 클라이언트에 월간 보고서 자동 발송 (구버전).
#
# 흐름:
#   1. Vercel deployed admin endpoint 호출 — /api/admin/reports/email
#   2. body: { all: true, cronSecret: CRON_SECRET, force?: true }
#   3. endpoint 가 Supabase 에서 today.day == report_send_day 인 tenants 추출 → Resend 발송
#   4. force=true 면 today_day 필터 무시 (manual run 용)
#
# 필수 secrets:
#   - VERCEL_PROD_URL — 예: https://geo-v2-beta.vercel.app
#   - CRON_SECRET — 보안용 (Vercel 환경변수도 동일하게 설정 필요)
#   - (Vercel 측) RESEND_API_KEY + RESEND_FROM

on:
  schedule:
    - cron: '0 9 * * *'   # 매일 09:00 UTC = 18:00 KST. endpoint 가 today_day == report_send_day 인 tenant 만 발송.
  workflow_dispatch:
    inputs:
      period:
        description: '발송 기간 라벨 (기본: 자동 추정)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: send-monthly-reports
  cancel-in-progress: false

jobs:
  send:
    name: Send all tenants' monthly reports
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify secrets
        run: |
          if [ -z "${{ secrets.VERCEL_PROD_URL }}" ]; then
            echo "::error::VERCEL_PROD_URL 미설정"
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::CRON_SECRET 미설정 — Vercel 환경변수도 동일하게 설정 필요"
            exit 1
          fi

      - name: Call email endpoint (all=true)
        env:
          VERCEL_URL: ${{ secrets.VERCEL_PROD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PERIOD: ${{ inputs.period }}
        run: |
          PERIOD_JSON=""
          if [ -n "$PERIOD" ]; then
            PERIOD_JSON=", \"period\": \"$PERIOD\""
          fi
          BODY="{\"all\": true, \"cronSecret\": \"$CRON_SECRET\"$PERIOD_JSON}"
          echo "Calling $VERCEL_URL/api/admin/reports/email"
          # Round 50 — X-Cron-Secret 헤더로 middleware 우회 + body 에도 cronSecret (route 가드)
          RESPONSE=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -d "$BODY" \
            "$VERCEL_URL/api/admin/reports/email")
          echo "$RESPONSE" | jq '.'
          OK=$(echo "$RESPONSE" | jq -r '.ok // false')
          if [ "$OK" != "true" ]; then
            echo "::error::Email API 호출 실패"
            exit 1
          fi
          SENT=$(echo "$RESPONSE" | jq -r '.sent // 0')
          FAILED=$(echo "$RESPONSE" | jq -r '.failed // 0')
          TOTAL=$(echo "$RESPONSE" | jq -r '.total // 0')
          echo "Sent: $SENT / Failed: $FAILED / Total: $TOTAL"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 월간 보고서 자동 발송"
            echo "- 매일 09:00 UTC (18:00 KST) 자동 실행"
            echo "- /api/admin/reports/email?all=true 호출"
            echo "- endpoint 가 today.day == tenant.report_send_day 인 tenant 만 발송"
            echo "- 결과는 위 step 의 RESPONSE 참조"
          } >> "$GITHUB_STEP_SUMMARY"

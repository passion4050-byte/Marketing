name: Measure competitor mentions (weekly Mon/Thu 06:00 KST)

# Round 35 (2026-05-31) — 경쟁사 (purpose='competitor_landscape') 키워드 전용 측정 cron.
#
# 분리 이유:
#   - 자사 own 측정 cron (measure-ai-mentions.yml) 은 매일 07:00 KST 실행 (KEYWORD_LIMIT=20)
#   - own 키워드(24개) 만으로 LIMIT 거의 채워서 competitor 키워드(id 54+) 가 픽업 안 됨
#   - Gemini free tier 20 req/day 제한도 있어 한 batch 에 모두 못 담음
#
# 운영 정책:
#   - 자사 own = 매일 측정 (T1/T2 share trend 추적)
#   - 경쟁사 competitor_landscape = 주 2회 (월/목) 측정 (T5 점유 변화는 더 느리게 변함)
#   - quota 분리로 Gemini paid tier 전까지도 운영 가능
#
# 안전 모드 — ENGINE_MODE secret 동일 (stub | production).

on:
  schedule:
    # 주 2회 — 매주 월 21:00 UTC (화 06:00 KST), 목 21:00 UTC (금 06:00 KST)
    # 자사 측정(매일 22:00 UTC) 보다 1시간 일찍 끝나도록 배치
    - cron: '0 21 * * 1,4'
  workflow_dispatch:
    inputs:
      engine_mode:
        description: 'engine mode (stub | production)'
        type: choice
        options: [stub, production]
        default: stub
      keyword_limit:
        description: '최대 키워드 수 (경쟁사 키워드 총 8개 + 여유)'
        type: string
        default: '20'

permissions:
  contents: read

concurrency:
  group: measure-competitor-mentions
  cancel-in-progress: false

jobs:
  measure:
    name: Run competitor measurement (purpose=competitor_landscape)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL 미설정"
            exit 1
          fi

      - name: Run measurement (competitor_landscape only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENGINE_MODE: ${{ inputs.engine_mode || secrets.ENGINE_MODE || 'stub' }}
          KEYWORD_LIMIT: ${{ inputs.keyword_limit || '20' }}
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '1.0' }}
          # 핵심 — 경쟁사 키워드만 픽업
          PURPOSE_FILTER: competitor_landscape
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Round 63 (2026-06-22) — GOOGLE_API_KEY 미설정 시 GEMINI_API_KEY 로 폴백.
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          echo "ENGINE_MODE=$ENGINE_MODE"
          echo "KEYWORD_LIMIT=$KEYWORD_LIMIT"
          echo "PURPOSE_FILTER=$PURPOSE_FILTER"
          python scripts/run_measurement_batch.py

      - name: Job summary
        if: always()
        run: |
          {
            echo "## 경쟁사 측정 결과"
            echo "- engine_mode: ${ENGINE_MODE:-stub}"
            echo "- purpose: competitor_landscape"
            echo "- 자세한 결과는 어드민 \`/admin/competitors\` 페이지 참조"
          } >> "$GITHUB_STEP_SUMMARY"

name: Measure AI mentions (daily 07:00 KST)

# Round 31 (2026-05-30) — AI 인용 추적 MVP.
# 매일 07:00 KST 에 자사 + 파트너 키워드를 4 엔진 (perplexity/openai/claude/gemini) 에
# 호출 → response/mention DB 저장 → 어드민 대시보드 KPI 갱신.
#
# 안전 모드 — ENGINE_MODE secret 으로 분기:
#   - `stub` (기본): 외부 API 호출 없음, demo 데이터로 파이프라인 검증
#   - `production`: 실제 4 엔진 API 호출, $0.20~0.30/일 비용 발생
#
# 비용 가드: MAX_DAILY_USD secret 으로 일일 USD 한도 강제 (collect.py 내장).

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 22:00 UTC = 07:00 KST — 자사 own 측정
  workflow_dispatch:
    inputs:
      engine_mode:
        description: 'engine mode (stub | production)'
        type: choice
        options: [production, stub]
        default: production
      keyword_limit:
        description: '최대 키워드 수 (테스트용)'
        type: string
        default: '20'
      purpose_filter:
        description: 'keyword purpose 필터 (own | competitor_landscape | all)'
        type: choice
        options: [own, competitor_landscape, all]
        default: own

permissions:
  contents: read

concurrency:
  group: measure-ai-mentions
  cancel-in-progress: false

jobs:
  measure:
    name: Run AI engine measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL 미설정"
            exit 1
          fi

      - name: Run measurement
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENGINE_MODE: ${{ inputs.engine_mode || secrets.ENGINE_MODE || 'stub' }}
          # Round 85 (2026-06-28) — 20 → 60 (활성 9 tenant × 평균 5 키워드 × 1 round 충분 커버)
          KEYWORD_LIMIT: ${{ inputs.keyword_limit || '60' }}
          # Round 85 — $1 → $5 (3엔진 활성, OpenAI/Anthropic paid 활용)
          MAX_DAILY_USD: ${{ secrets.MAX_DAILY_USD || '5.0' }}
          # Round 35 (2026-05-31): 자사 own 키워드만 측정 (기본).
          # 'all' 선택 시 own + competitor 섞임 → ORDER BY k.id + LIMIT 20 로 competitor 누락 위험.
          # competitor_landscape 측정은 measure-competitor-mentions.yml 분리 운영.
          PURPOSE_FILTER: ${{ inputs.purpose_filter == 'all' && '' || (inputs.purpose_filter || 'own') }}
          # 4 엔진 API keys (production 모드만)
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Round 63 (2026-06-22) — GOOGLE_API_KEY 미설정 시 GEMINI_API_KEY 로 폴백.
          #   (secret 이 GEMINI_API_KEY 이름으로만 등록된 경우 production 모드에서 Gemini 엔진 누락 방지)
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          echo "ENGINE_MODE=$ENGINE_MODE"
          echo "KEYWORD_LIMIT=$KEYWORD_LIMIT"
          echo "MAX_DAILY_USD=$MAX_DAILY_USD"
          echo "PURPOSE_FILTER=${PURPOSE_FILTER:-(all)}"
          python scripts/run_measurement_batch.py

      - name: Job summary
        if: always()
        # Round 178 (2026-08-30) — env 누락 버그. 이 스텝에 ENGINE_MODE 가 안 넘어와
        #   실제로 production 으로 돌아도 요약에는 항상 "stub" 이 찍혔다.
        #   2026-08-30 키 복구 검증 때 "테스트가 안 돌았다"고 오진할 뻔했다.
        #   (실제 호출 여부의 정본은 llm_call_logs 다.)
        env:
          ENGINE_MODE: ${{ inputs.engine_mode || secrets.ENGINE_MODE || 'stub' }}
          KEYWORD_LIMIT: ${{ inputs.keyword_limit || '60' }}
        run: |
          {
            echo "## AI 측정 결과"
            echo "- engine_mode: ${ENGINE_MODE}"
            echo "- keyword_limit: ${KEYWORD_LIMIT}"
            echo "- 자세한 결과는 어드민 \`/admin/citations\` 페이지 참조"
          } >> "$GITHUB_STEP_SUMMARY"

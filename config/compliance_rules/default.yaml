# 의료법 컴플라이언스 룰셋 — default tenant.
#
# 출처(요약):
#   - 의료법 제56조 (의료광고의 금지 등)
#   - 의료광고 사전심의 가이드라인 (대한의사협회 의료광고심의위원회)
#   - 의료광고 자율심의 사례집 (보건복지부)
#   - 표시광고법 위반 사례 (공정거래위원회)
#
# 정확한 1차 자료는 .planning/SPEC-v2.md 부록 B 참조. 본 yaml은 데모용 기본 룰셋.
#
# 룰 타입:
#   - forbidden_word        : 패턴이 텍스트에 등장하면 위반
#   - required_disclaimer   : 패턴 등장 시 requires 정규식이 함께 있어야 함
#   - pattern               : 일반 정규식 매치
#
# severity: error | warning | info

tenant_id: 1
rules:
  - id: ABS-GUARANTEE
    type: forbidden_word
    severity: error
    pattern: "100%\\s*(보장|성공|완치|효과)"
    message: "절대적 보장 표현은 의료법 제56조 위반 가능성. '높은 만족도', '대다수의 환자에게서' 등으로 대체."

  - id: SUPERLATIVE
    type: forbidden_word
    severity: error
    pattern: "(최고|유일|최초|국내\\s*최고|업계\\s*1위)"
    message: "최상급 표현은 객관적 근거가 없으면 부당광고. 구체 수치(예: '연 1만 건 시술 경력')로 대체."

  - id: CURE-PROMISE
    type: forbidden_word
    severity: error
    pattern: "(완치\\s*보장|반드시\\s*낫|영구적\\s*효과)"
    message: "완치/영구 효과 약속은 의료법 위반. 효과의 개인차 명시 필요."

  - id: PAIN-FREE-ABS
    type: forbidden_word
    severity: warning
    pattern: "(통증\\s*제로|전혀\\s*아프지\\s*않|무통증\\s*시술)"
    message: "절대적 무통 표현은 부당광고 가능. '통증을 최소화' 등으로 완화."

  - id: PRICE-LURE
    type: forbidden_word
    severity: warning
    pattern: "(파격\\s*할인|초특가|반값|공짜)"
    message: "환자 유인 의도가 강한 가격 표현은 의료법 제27조(환자 유인행위) 검토 필요."

  - id: EVENT-DISCLAIMER
    type: required_disclaimer
    severity: warning
    pattern: "(이벤트|할인|프로모션|특별가)"
    requires: "(\\d{4}[\\.\\-]\\d{1,2}[\\.\\-]\\d{1,2}|기간\\s*한정|종료일)"
    message: "이벤트/할인 표현 시 종료일/기간을 명시해야 함."

  - id: PRESCREENING
    type: pattern
    severity: warning
    pattern: "(?i)(treatment\\s*effects?|효과\\s*보장|시술\\s*효능)"
    message: "의료광고 사전심의 대상 표현일 수 있음. 자율심의기구 검토 권장."

  - id: COMPARISON-NEGATIVE
    type: forbidden_word
    severity: warning
    pattern: "(타\\s*병원보다\\s*우월|다른\\s*곳은\\s*못)"
    message: "비교 광고는 객관적 근거가 없으면 부당광고."

  - id: BEFORE-AFTER
    type: pattern
    severity: info
    pattern: "(시술\\s*전후|비포\\s*&?\\s*애프터|before\\s*&?\\s*after)"
    message: "시술 전후 사진/표현은 사전심의 대상. 환자 동의 + 동일 조건 촬영 필수."

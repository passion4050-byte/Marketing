# Phase 5-T1.1 — Mention Extractor v2 시그널 룰북
#
# 매치 위치 ± 30자 윈도우 안에 등장하면 strength_score 또는 is_negative 결정.
# 형태소 분석은 미사용 (Phase 6 예정) — 어절/substring 매칭.
#
# 카테고리:
# - recommendation: 추천/권장 동사 → strength_score = 1.0
# - comparison:    비교 표현      → strength_score = 0.3
# - negative:      부정 컨텍스트   → is_negative = True
#
# (없으면 기본 strength_score = 0.7 단순 언급)

